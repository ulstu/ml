<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="905px" preserveAspectRatio="none" style="width:699px;height:905px;background:#FFFFFF;" version="1.1" viewBox="0 0 699 905" width="699px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="5"><text fill="#000000" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="395.7256" x="148.2721" y="23.1318">&#1055;&#1086;&#1083;&#1085;&#1099;&#1081; pipeline LLM + Vector DB + &#1092;&#1086;&#1088;&#1084;&#1072;&#1083;&#1100;&#1085;&#1099;&#1077; &#1084;&#1086;&#1076;&#1077;&#1083;&#1080;</text></g><!--entity state--><g class="entity" data-qualified-name="state" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="68.2959" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="204.4336" x="257.21" y="44.0986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="143.1924" x="267.21" y="67.2305">1. Sensor / State Layer</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="184.4336" x="267.21" y="83.3291">robot-agent status messages,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="140.8408" x="267.21" y="99.4277">tasks, batteries, routes</text></g><!--entity vectordb--><g class="entity" data-qualified-name="vectordb" data-source-line="8" id="ent0003"><path d="M41.22,198.3886 C41.22,188.3886 165.4348,188.3886 165.4348,188.3886 C165.4348,188.3886 289.6497,188.3886 289.6497,198.3886 L289.6497,255.6845 C289.6497,265.6845 165.4348,265.6845 165.4348,265.6845 C165.4348,265.6845 41.22,265.6845 41.22,255.6845 L41.22,198.3886" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M41.22,198.3886 C41.22,208.3886 165.4348,208.3886 165.4348,208.3886 C165.4348,208.3886 289.6497,208.3886 289.6497,198.3886" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="116.7236" x="51.22" y="225.5205">2. Local Vector DB</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="136.1924" x="51.22" y="241.6191">warehouse_rules.json</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="228.4297" x="51.22" y="257.7177">hashed embeddings + cosine search</text></g><!--entity llm--><g class="entity" data-qualified-name="llm" data-source-line="9" id="ent0004"><rect fill="#F1F1F1" height="84.3945" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="163.1719" x="221.84" y="341.6886"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="140.8477" x="231.84" y="364.8205">3. Strategic LLM Layer</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="122.9512" x="231.84" y="380.9191">Ollama on localhost</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="143.1719" x="231.84" y="397.0177">weights, safety margin,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="90.2891" x="231.84" y="413.1164">blocked edges</text></g><!--entity game--><g class="entity" data-qualified-name="game" data-source-line="10" id="ent0005"><rect fill="#F1F1F1" height="84.3945" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.8613" x="7" y="502.0886"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="144.7236" x="17" y="525.2205">4. Tactical Game Layer</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="127.6201" x="17" y="541.3191">Contract Net auction</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="109.7373" x="17" y="557.4177">Congestion game</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="168.8613" x="17" y="573.5164">Best-response Nash profile</text></g><!--entity control--><g class="entity" data-qualified-name="control" data-source-line="11" id="ent0006"><rect fill="#F1F1F1" height="84.3945" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="217.6611" x="241.6" y="662.4786"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="197.6611" x="251.6" y="685.6105">5. Distributed Operational Layer</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="125.2754" x="251.6" y="701.7091">per-robot controllers</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="145.5098" x="251.6" y="717.8077">A* planner, traffic rules,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="97.2617" x="251.6" y="733.9064">collision checks</text></g><!--entity webots--><g class="entity" data-qualified-name="webots" data-source-line="12" id="ent0007"><rect fill="#F1F1F1" height="68.2959" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="163.1924" x="370.83" y="822.8686"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="91.0479" x="380.83" y="846.0005">Webots Scene</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="143.1924" x="380.83" y="862.0991">robot/cargo translation,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="141.6543" x="380.83" y="878.1977">rotation and event logs</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="23" id="ent0016"><path d="M230.77,516.8586 L230.77,571.7048 A0,0 0 0 0 230.77,571.7048 L480.0888,571.7048 A0,0 0 0 0 480.0888,571.7048 L480.0888,526.8586 L470.0888,516.8586 L350.59,516.8586 L317.09,426.4986 L342.59,516.8586 L230.77,516.8586 A0,0 0 0 0 230.77,516.8586" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M470.0888,516.8586 L470.0888,526.8586 L480.0888,526.8586 L470.0888,516.8586" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="228.3188" x="236.77" y="534.0525">The LLM does not directly drive motors.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="183.5234" x="236.77" y="549.0012">It tunes strategic parameters for</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="136.5571" x="236.77" y="563.9499">formal decision models.</text></g><!--link state to vectordb--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk8"><path d="M291.66,112.8786 C276.24,121.6686 260.33,131.7086 246.43,142.3886 C228.96,155.8286 215.7574,168.5677 201.6674,183.8477" fill="none" id="state-to-vectordb" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="197.6,188.2586,206.6417,184.3538,200.9895,184.5829,200.7605,178.9306,197.6,188.2586" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="85.2617" x="247.43" y="155.5825">compact query</text></g><!--link vectordb to llm--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="15" id="lnk9"><path d="M199.19,265.9186 C219.54,288.7486 241.4778,313.3796 262.3878,336.8396" fill="none" id="vectordb-to-llm" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="266.38,341.3186,263.3777,331.9385,263.0531,337.5861,257.4056,337.2615,266.38,341.3186" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="82.367